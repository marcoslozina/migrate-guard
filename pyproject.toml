[project]
name = "migrate-guard"
version = "0.1.0"
description = "Catch behavior changes when you rewrite a legacy service: in the response AND in the database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marcos Lozina", email = "marcoslozina@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["migration", "parity", "differential-testing", "legacy", "ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.8",
    "typer>=0.28.0",
]

[project.scripts]
migrate-guard = "migrate_guard.cli.app:main"

[project.entry-points.pytest11]
migrate_guard = "migrate_guard.pytest_plugin"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.8",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
demo = [
    "fastapi>=0.162.2",
    "flask>=3.1.3",
    "uvicorn>=0.54.0",
]
dev = [
    "mypy>=2.4.1",
    "psycopg[binary]>=3.3.8",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S314"]  # asserts; fake passwords; parsing our own XML

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["migrate_guard"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a real database (SQLite file or a Postgres container)"]
